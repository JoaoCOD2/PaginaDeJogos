<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090a0f">
    <title>Jogo da Velha - Multiplayer Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- TELA INICIAL -->
    <div id="startScreen" class="screen active">
        <div class="start-container">
            <h1>Jogo da Velha</h1>
            <p class="subtitle">Multiplayer Online</p>

            <div class="button-group">
                <button id="createRoomBtn" class="primary-btn">
                    Nova Sala
                </button>
                <button id="joinRoomBtn" class="secondary-btn">
                    Entrar em Sala
                </button>
            </div>

            <!-- Modal para entrar em sala -->
            <div id="joinModal" class="modal hidden">
                <div class="modal-content">
                    <h2>Entrar em Sala</h2>
                    <input type="text" id="roomCodeInput" placeholder="Digite o código da sala" maxlength="6">
                    <div class="modal-buttons">
                        <button id="confirmJoinBtn" class="primary-btn">Entrar</button>
                        <button id="cancelJoinBtn" class="secondary-btn">Cancelar</button>
                    </div>
                    <p id="errorMessage" class="error"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA DE JOGO -->
    <div id="gameScreen" class="screen">
        <div class="game-container">
            <!-- Header com informações da sala -->
            <div class="game-header">
                <div class="room-info">
                    <div class="status-indicator">
                        <span id="onlineStatus" class="status-dot online"></span>
                        <span id="onlineText">Online</span>
                    </div>
                    <div class="room-code">
                        Sala: <span id="roomCodeDisplay"></span>
                        <button id="copyRoomBtn" class="copy-btn" title="Copiar código">📋</button>
                    </div>
                </div>
                <h1>Jogo da Velha</h1>
                <div class="player-info">
                    <div class="player-symbol">
                        <span id="playerSymbol"></span>
                        <span id="playerLabel"></span>
                    </div>
                </div>
            </div>

            <!-- Status do jogo -->
            <div id="gameStatus" class="game-status">
                Esperando segundo jogador...
            </div>

            <!-- Tabuleiro -->
            <div class="board">
                <div id="win-line"></div>
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>

                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>

                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- Botões de ação -->
            <div class="button-group">
                <button id="restartBtn" class="primary-btn">
                    Jogar Novamente
                </button>
                <button id="exitBtn" class="secondary-btn">
                    Sair
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA1TSwuRHtwCnysk0_lLpuCchN-0-id-i8",
            authDomain: "jogo-da-velha-4fae7.firebaseapp.com",
            databaseURL: "https://jogo-da-velha-4fae7-default-rtdb.firebaseio.com",
            projectId: "jogo-da-velha-4fae7",
            storageBucket: "jogo-da-velha-4fae7.firebasestorage.app",
            messagingSenderId: "459477416435",
            appId: "1:459477416435:web:885bb97e057e50df333a86",
            measurementId: "G-9D7ESNG8F8"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Passar o database para o script global
        window.firebaseConfig = { app, database };
    </script>

    <!-- Game Script -->
    <script type="module" src="js/script.js"></script>

</body>

</html>
